name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer Tool
        uses: GeorgiMarinov/action-buildozer@v1
        with:
          command: buildozer -v android debug
